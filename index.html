<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особиста AI Студія</title>
    <style>
        :root { --bg: #0b0f19; --card: #131c2e; --accent: #3b82f6; --text: #ffffff; --text-muted: #64748b; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; }
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { font-size: 26px; margin: 0 0 8px 0; background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 14px; margin: 0; }
        .upload-zone { background-color: var(--card); border: 2px dashed #1e293b; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 15px; cursor: pointer; position: relative; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-box { max-width: 100%; max-height: 220px; border-radius: 8px; display: none; margin-top: 10px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .status-box { display: none; background: #1e1b4b; border: 1px solid #4338ca; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 14px; color: #c7d2fe; text-align: center; }
        .result-box { background-color: var(--card); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Personal AI Face Swap 🎬</h1>
            <p>Безкоштовна заміна облич на фото без помилок з'єднання</p>
        </div>

        <div class="upload-zone">
            <div>👤 Фото вашого обличчя (Джерело)</div>
            <input type="file" id="sourceFile" accept="image/*" onchange="preview(this, 'sourcePreview')">
            <img id="sourcePreview" class="preview-box" style="margin:10px auto 0 auto;">
        </div>

        <div class="upload-zone">
            <div>🖼️ Цільове Фото (Куди вставити)</div>
            <input type="file" id="targetFile" accept="image/*" onchange="preview(this, 'targetPreview')">
            <img id="targetPreview" class="preview-box" style="margin:10px auto 0 auto;">
        </div>

        <button class="btn-submit" onclick="startSwap()">Запустити ШІ обробку</button>

        <div id="statusBox" class="status-box"></div>

        <div class="result-box">
            <h3>Отриманий результат:</h3>
            <div id="resultContainer" style="color:var(--text-muted); font-size:14px; padding:20px 0;">Тут з'явиться готове фото</div>
        </div>
    </div>

    <script>
        function preview(input, id) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(id);
                img.src = e.target.result;
                img.style.display = 'block';
                input.previousElementSibling.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function startSwap() {
            const source = document.getElementById('sourceFile').files[0];
            const target = document.getElementById('targetFile').files[0];
            const status = document.getElementById('statusBox');
            const resultDiv = document.getElementById('resultContainer');

            if (!source || !target) { alert('Будь ласка, завантажте обидва фото!'); return; }

            status.style.display = 'block';
            status.innerHTML = '🤖 ШІ підключається та обробляє фото... Зачекайте приблизно 15-30 секунд.';

            try {
                const sourceBase64 = await fileToBase64(source);
                const targetBase64 = await fileToBase64(target);

                // Використовуємо стабільний безкоштовний проксі-сервер обробки без CORS блокувань
                const response = await fetch("https://hf.space", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: [
                            `data:image/jpeg;base64,${sourceBase64}`,
                            `data:image/jpeg;base64,${targetBase64}`
                        ]
                    })
                });

                const resData = await response.json();
                
                if (resData.data && resData.data[0]) {
                    status.innerHTML = '✅ Готово!';
                    const finalImg = resData.data[0];
                    resultDiv.innerHTML = `<img src="${finalImg}" style="max-width:100%; border-radius:8px;"><br><a href="${finalImg}" download="faceswap.jpg" style="color:#60a5fa; text-decoration:none; font-weight:bold; display:block; margin-top:10px;">📥 Завантажити фото в галерею</a>`;
                } else {
                    throw new Error('Сервер повернув порожню відповідь. Спробуйте інші фото.');
                }
            } catch (err) {
                status.innerHTML = '❌ Помилка: Не вдалося з\'єднатися із безкоштовним сервером ШІ. Спробуйте ще раз за хвилину.';
                console.error(err);
            }
        }
    </script>
</body>
</html>
