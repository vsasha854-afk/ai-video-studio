<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особиста AI Студія</title>
    <style>
        :root { --bg: #0b0f19; --card: #131c2e; --accent: #3b82f6; --text: #ffffff; --text-muted: #64748b; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 26px; margin: 0 0 8px 0; background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .server-config { background-color: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .server-config input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .upload-zone { background-color: var(--card); border: 2px dashed #1e293b; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 15px; cursor: pointer; position: relative; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-box { max-width: 100%; max-height: 220px; border-radius: 8px; display: none; margin-top: 10px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 10px; }
        .status-box { display: none; background: #1e1b4b; border: 1px solid #4338ca; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 14px; color: #c7d2fe; text-align: center; }
        .result-box { background-color: var(--card); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Personal AI Studio 🎬</h1>
        </div>
        <div class="server-config">
            <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px;">Адреса вашого ШІ сервера з Colab:</label>
            <input type="text" id="serverUrl" placeholder="Вставте посилання .trycloudflare.com або .gradio.live">
        </div>
        <div class="upload-zone">
            <div>👤 Фото вашого обличчя</div>
            <input type="file" id="sourceFile" accept="image/*" onchange="preview(this, 'sourcePreview')">
            <img id="sourcePreview" class="preview-box" style="margin:10px auto 0 auto;">
        </div>
        <div class="upload-zone">
            <div>🖼️ Цільове Фото (Шаблон)</div>
            <input type="file" id="targetFile" accept="image/*" onchange="preview(this, 'targetPreview')">
            <img id="targetPreview" class="preview-box" style="margin:10px auto 0 auto;">
        </div>
        <button class="btn-submit" onclick="startSwap()">Запустити обробку</button>
        <div id="statusBox" class="status-box"></div>
        <div class="result-box">
            <h3>Результат:</h3>
            <div id="resultContainer" style="color:var(--text-muted); font-size:14px; padding:20px 0;">Тут з'явиться готове фото</div>
        </div>
    </div>
    <script>
        function preview(input, id) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(id); img.src = e.target.result; img.style.display = 'block';
                input.previousElementSibling.style.display = 'none';
            }; reader.readAsDataURL(file);
        }
        async function startSwap() {
            const url = document.getElementById('serverUrl').value.trim();
            const source = document.getElementById('sourceFile').files[0];
            const target = document.getElementById('targetFile').files[0];
            const status = document.getElementById('statusBox');
            const resultDiv = document.getElementById('resultContainer');
            if (!url || !source || !target) { alert('Заповніть адресу сервера та завантажте обидва фото!'); return; }
            status.style.display = 'block'; status.innerHTML = '🤖 Обробка на вашому приватному сервері... Зачекайте 10-15 секунд.';
            const formData = new FormData(); formData.append('source', source); formData.append('target', target);
            try {
                const res = await fetch(`${url}/swap`, { method: 'POST', body: formData });
                const blob = await res.blob(); const imgUrl = URL.createObjectURL(blob);
                status.innerHTML = '✅ Успішно!';
                resultDiv.innerHTML = `<img src="${imgUrl}" style="max-width:100%; border-radius:8px;"><br><a href="${imgUrl}" download="result.jpg" style="color:#60a5fa; text-decoration:none; font-weight:bold; display:block; margin-top:10px;">📥 Зберегти фото</a>`;
            } catch (err) { status.innerHTML = '❌ Помилка з\'єднання із сервером. Перевірте посилання.'; }
        }
    </script>
</body>
</html>
