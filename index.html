<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особиста AI Відеостудія</title>
    <style>
        :root { --bg: #0b0f19; --card: #131c2e; --accent: #3b82f6; --text: #ffffff; --text-muted: #64748b; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 26px; margin: 0 0 8px 0; background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 14px; margin: 0; }
        .config-box { background-color: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .config-box input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .upload-zone { background-color: var(--card); border: 2px dashed #1e293b; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 15px; cursor: pointer; position: relative; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-box { max-width: 100%; max-height: 220px; border-radius: 8px; display: none; margin-top: 10px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .status-box { display: none; background: #1e1b4b; border: 1px solid #4338ca; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 14px; color: #c7d2fe; text-align: center; }
        .result-box { background-color: var(--card); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Personal AI Face Swap 🎬</h1>
            <p>Пряма заміна облич на фото та відео через Fal API</p>
        </div>

        <div class="config-box">
            <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px;">Ваш персональний Fal API Ключ:</label>
            <input type="password" id="apiKey" placeholder="Вставте ваш ключ fal_...">
        </div>

        <div class="upload-zone">
            <div>👤 Фото вашого обличчя (Джерело)</div>
            <input type="file" id="sourceFile" accept="image/*" onchange="preview(this, 'sourcePreview', 'image')">
            <img id="sourcePreview" class="preview-box" style="margin:10px auto 0 auto;">
        </div>

        <div class="upload-zone">
            <div>🎞️ Цільове Відео або Фото (Куди вставити)</div>
            <input type="file" id="targetFile" accept="image/*,video/*" onchange="preview(this, 'targetPreview', 'video')">
            <img id="targetPreview" class="preview-box" style="margin:10px auto 0 auto;">
            <video id="targetVideo" class="preview-box" controls style="margin:10px auto 0 auto;"></video>
        </div>

        <button class="btn-submit" onclick="startSwap()">Запустити ШІ обробку</button>

        <div id="statusBox" class="status-box"></div>

        <div class="result-box">
            <h3>Отриманий результат:</h3>
            <div id="resultContainer" style="color:var(--text-muted); font-size:14px; padding:20px 0;">Тут з'явиться готовий файл</div>
        </div>
    </div>

    <script>
        function preview(input, id, type) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if(file.type.startsWith('video/')) {
                    document.getElementById('targetPreview').style.display = 'none';
                    const v = document.getElementById('targetVideo');
                    v.src = e.target.result; v.style.display = 'block';
                } else {
                    document.getElementById('targetVideo').style.display = 'none';
                    const img = document.getElementById(id === 'sourcePreview' ? 'sourcePreview' : 'targetPreview');
                    img.src = e.target.result; img.style.display = 'block';
                }
                input.previousElementSibling.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function startSwap() {
            const key = document.getElementById('apiKey').value.trim();
            const source = document.getElementById('sourceFile').files[0];
            const target = document.getElementById('targetFile').files[0];
            const status = document.getElementById('statusBox');
            const resultDiv = document.getElementById('resultContainer');

            if (!key || !source || !target) { alert('Заповніть ключ та завантажте обидва файли!'); return; }

            status.style.display = 'block';
            status.innerHTML = '🔄 Кодування файлів та надсилання до хмари ШІ...';

            try {
                const sourceBase64 = await fileToBase64(source);
                const targetBase64 = await fileToBase64(target);
                const isVideo = target.type.startsWith('video/');
                
                const endpoint = isVideo ? "fal-ai/face-swap/video" : "fal-ai/face-swap";

                status.innerHTML = '🤖 ШІ обробляє ваше медіа... Зачекайте трохи.';

                const response = await fetch(`https://fal.run{endpoint}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Key ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ background_image_url: targetBase64, face_image_url: sourceBase64 })
                });

                const resData = await response.json();
                
                if(resData.request_id) {
                    checkStatus(resData.request_id, key, isVideo);
                } else {
                    throw new Error('Не вдалося отримати ID завдання');
                }
            } catch (err) {
                status.innerHTML = '❌ Помилка: ' + err.message;
            }
        }

        async function checkStatus(id, key, isVideo) {
            const status = document.getElementById('statusBox');
            const resultDiv = document.getElementById('resultContainer');
            const endpoint = isVideo ? "fal-ai/face-swap/video" : "fal-ai/face-swap";

            const timer = setInterval(async () => {
                const check = await fetch(`https://fal.run{endpoint}/requests/${id}`, {
                    headers: { 'Authorization': `Key ${key}` }
                });
                const data = await check.json();
                
                if(data.status === 'COMPLETED') {
                    clearInterval(timer);
                    status.innerHTML = '✅ Готово!';
                    const fileUrl = data.logs || data.image?.url || data.video?.url || data.output;
                    if(isVideo || fileUrl.includes('.mp4')) {
                        resultDiv.innerHTML = `<video src="${fileUrl}" controls style="max-width:100%; border-radius:8px;"></video><br><a href="${fileUrl}" download style="color:#60a5fa; text-decoration:none; font-weight:bold; display:block; margin-top:10px;">📥 Завантажити відео</a>`;
                    } else {
                        resultDiv.innerHTML = `<img src="${fileUrl}" style="max-width:100%; border-radius:8px;"><br><a href="${fileUrl}" download style="color:#60a5fa; text-decoration:none; font-weight:bold; display:block; margin-top:10px;">📥 Завантажити фото</a>`;
                    }
                } else if (data.status === 'FAILED') {
                    clearInterval(timer);
                    status.innerHTML = '❌ Обробка скасована або сталася помилка серверів.';
                }
            }, 3000);
        }
    </script>
</body>
</html>
